<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Selection Methods</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@600;700&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden}

:root{
  --blue:#0061ad;
  --blue2:#004d8a;
  --blue3:#003d6e;
  --bluelight:#3d9be0;
  --bg:#000D1A;
  --card:#001628;
  --txt:#C8E4F8;
  --red:#E03030;
}

body{
  background:var(--bg);
  color:var(--txt);
  font-family:'Nunito',sans-serif;
}

.screen{position:fixed;inset:0;display:none;align-items:center;justify-content:center}
.screen.active{display:flex}

/* ── SETUP ── */
#setupScreen{background:radial-gradient(ellipse 80% 70% at 50% 30%,#001E3C 0%,#000D1A 75%)}

.card{
  background:var(--card);
  border:1px solid rgba(0,97,173,0.38);
  border-radius:22px;
  padding:36px 40px;
  width:min(520px,94vw);text-align:center;
  box-shadow:0 0 80px rgba(0,97,173,0.2),0 0 0 1px rgba(0,97,173,0.07);
  overflow:hidden;
}

/* Story logo bar — sits flush at the top of the card */
.story-logo-bar{
  background:#0061AD;
  margin:-36px -40px 28px;
  padding:16px 24px;
  display:flex;
  align-items:center;
  justify-content:center;
}
.story-logo-bar svg{
  width:150px;
  height:auto;
  display:block;
}

.card h1{
  font-family:'Montserrat',sans-serif;
  font-weight:600;
  font-size:2.2rem;
  letter-spacing:2px;
  color:var(--bluelight);
  text-shadow:0 0 40px rgba(0,97,173,0.7);
  margin-bottom:4px;
}
.card .sub{font-size:.88rem;color:rgba(200,228,248,.5);margin-bottom:28px}

.drop-zone{
  border:2px dashed rgba(0,97,173,0.4);border-radius:14px;
  padding:26px 18px;cursor:pointer;
  transition:border-color .2s,background .2s;margin-bottom:20px;user-select:none;
}
.drop-zone:hover,.drop-zone.over{border-color:var(--bluelight);background:rgba(0,97,173,.06)}
.dz-icon{font-size:2.2rem;margin-bottom:10px}
.dz-main{font-size:.92rem;color:rgba(200,228,248,.8);margin-bottom:5px}
.dz-sub{font-size:.76rem;color:rgba(200,228,248,.38);margin-bottom:14px}

.btn{
  background:linear-gradient(135deg,var(--blue),var(--blue2));
  color:#fff;border:none;border-radius:8px;padding:9px 22px;
  font-family:'Nunito',sans-serif;font-weight:800;font-size:.88rem;
  cursor:pointer;transition:transform .15s,box-shadow .15s;
}
.btn:hover{transform:translateY(-2px);box-shadow:0 4px 18px rgba(0,97,173,.55)}

.delegate-preview{
  text-align:left;background:rgba(0,97,173,.07);border-radius:10px;
  padding:12px 16px;margin-bottom:16px;max-height:140px;overflow-y:auto;
  scrollbar-width:thin;scrollbar-color:rgba(0,97,173,.4) transparent;
}
.delegate-preview h4{font-size:.72rem;text-transform:uppercase;letter-spacing:1.5px;color:var(--bluelight);margin-bottom:8px}
.d-item{font-size:.86rem;color:rgba(200,228,248,.68);padding:2px 0}

.launch-btn{
  display:block;width:100%;padding:14px;
  background:linear-gradient(135deg,var(--blue),var(--blue2));
  color:#fff;border:none;border-radius:12px;
  font-family:'Montserrat',sans-serif;font-weight:700;font-size:1rem;letter-spacing:2px;
  cursor:pointer;margin-bottom:14px;transition:transform .15s,box-shadow .15s;
}
.launch-btn:hover{transform:translateY(-2px);box-shadow:0 6px 28px rgba(0,97,173,.55)}

.skip{font-size:.8rem;color:rgba(200,228,248,.32)}
.skip a{color:rgba(61,155,224,.7);text-decoration:none}
.skip a:hover{color:var(--bluelight)}

/* ── GAME ── */
#gameScreen{
  flex-direction:column;align-items:center;justify-content:center;gap:0;
  background:radial-gradient(ellipse 90% 80% at 50% 40%,#001C38 0%,#000810 100%);
  padding:10px 12px;
  position:relative;
}

/* Small Story logo — top-right of game screen */
.game-logo-wrap{
  position:absolute;
  top:14px;
  right:18px;
  width:76px;
  opacity:.9;
}
.game-logo-wrap svg{
  width:76px;
  height:auto;
  display:block;
}

.g-title{
  font-family:'Montserrat',sans-serif;
  font-weight:600;
  font-size:1.3rem;
  letter-spacing:3px;
  color:var(--bluelight);
  text-shadow:0 0 28px rgba(0,97,173,.7);
  margin-bottom:6px;flex-shrink:0;
}

.wheel-wrap{position:relative;flex-shrink:0}
.wheel-svg-wrap{position:relative;display:block}

#wheelSvg{
  display:block;
  width:min(calc(100dvh - 270px),calc(100vw - 60px),660px);
  height:min(calc(100dvh - 270px),calc(100vw - 60px),660px);
  transform-origin:center center;will-change:transform;
  filter:drop-shadow(0 6px 28px rgba(0,40,100,.55));
}

#arrowSvg{
  position:absolute;inset:0;width:100%;height:100%;
  pointer-events:none;z-index:10;overflow:visible;
}

.controls{display:flex;flex-direction:column;align-items:center;gap:5px;flex-shrink:0;margin-top:8px}

.spin-btn{
  width:76px;height:76px;border-radius:50%;
  background:radial-gradient(circle at 36% 34%,#FF7070,#CC1010 62%,#8A0808);
  border:3px solid rgba(255,255,255,.13);color:#fff;
  font-family:'Bebas Neue',cursive;font-size:1.25rem;letter-spacing:2px;
  cursor:pointer;
  box-shadow:0 4px 22px rgba(200,0,0,.55),inset 0 1px 0 rgba(255,255,255,.18),0 0 0 5px rgba(220,30,30,.18);
  transition:transform .14s,box-shadow .14s;
}
.spin-btn:hover:not(:disabled){transform:scale(1.07);box-shadow:0 6px 30px rgba(200,0,0,.75),inset 0 1px 0 rgba(255,255,255,.18),0 0 0 7px rgba(220,30,30,.25)}
.spin-btn:active:not(:disabled){transform:scale(.94)}
.spin-btn:disabled{opacity:.42;cursor:not-allowed}

.spin-count{font-size:.78rem;letter-spacing:1px;color:rgba(200,228,248,.38)}

.slot-wrap{display:flex;flex-direction:column;align-items:center;gap:5px;flex-shrink:0;margin-top:6px}
.slot-label{font-size:.7rem;text-transform:uppercase;letter-spacing:2px;color:rgba(61,155,224,.8)}

.slot-window{
  position:relative;width:min(340px,88vw);height:56px;
  background:#000A15;border:2px solid rgba(0,97,173,.7);border-radius:10px;overflow:hidden;
  box-shadow:0 0 22px rgba(0,97,173,.25),inset 0 0 14px rgba(0,0,0,.65);
}
.slot-window::before,.slot-window::after{content:'';position:absolute;left:0;right:0;height:15px;z-index:2;pointer-events:none}
.slot-window::before{top:0;background:linear-gradient(to bottom,#000A15,transparent)}
.slot-window::after{bottom:0;background:linear-gradient(to top,#000A15,transparent)}

#slotReel{position:absolute;top:0;left:0;right:0}
.reel-item{
  height:56px;display:flex;align-items:center;justify-content:center;
  font-family:'Bebas Neue',cursive;font-size:1.4rem;letter-spacing:3px;
  color:var(--bluelight);text-shadow:0 0 14px rgba(0,97,173,.7);
}

.reset-btn{
  background:transparent;border:2px solid rgba(0,97,173,.55);
  color:rgba(61,155,224,.85);font-family:'Montserrat',sans-serif;
  font-weight:600;font-size:.85rem;letter-spacing:2px;padding:8px 24px;border-radius:8px;
  cursor:pointer;transition:all .2s;flex-shrink:0;margin-top:4px;
}
.reset-btn:hover{background:rgba(0,97,173,.12);border-color:var(--bluelight);color:var(--bluelight)}

.setup-btn{
  background:transparent;border:none;
  color:rgba(200,228,248,.28);
  font-family:'Nunito',sans-serif;font-weight:700;font-size:.75rem;
  letter-spacing:.5px;padding:4px 10px;border-radius:6px;
  cursor:pointer;transition:color .2s;flex-shrink:0;margin-top:2px;
}
.setup-btn:hover{color:rgba(200,228,248,.65)}

.hidden{display:none!important}

/* ── Ready overlay ── */
#readyOverlay{
  position:fixed;inset:0;z-index:100;
  display:none;
  align-items:center;justify-content:center;
  background:rgba(0,10,22,.72);
  backdrop-filter:blur(4px);
}
#readyOverlay.show{display:flex}

#readyBtn{
  padding:18px 44px;
  background:linear-gradient(135deg,var(--blue),var(--blue2));
  color:#fff;border:none;border-radius:50px;
  font-family:'Montserrat',sans-serif;font-weight:700;font-size:1.2rem;letter-spacing:3px;
  cursor:pointer;
  box-shadow:0 0 0 0 rgba(61,155,224,.55);
  animation:pulse 1.6s ease-in-out infinite;
  transition:transform .15s,box-shadow .15s,opacity .5s,background .3s;
}
#readyBtn:hover{transform:scale(1.06)}

@keyframes pulse{
  0%,100%{box-shadow:0 0 0 0 rgba(61,155,224,.5)}
  50%{box-shadow:0 0 0 18px rgba(61,155,224,0)}
}
@keyframes readyFlash{
  0%{background:linear-gradient(135deg,#fff,#c8e4f8);transform:scale(1.12)}
  100%{background:linear-gradient(135deg,var(--blue),var(--blue2));transform:scale(1);opacity:0}
}

@keyframes popIn{from{transform:scale(.75);opacity:0}to{transform:scale(1);opacity:1}}
.pop-in{animation:popIn .32s cubic-bezier(.34,1.56,.64,1) forwards}
</style>
</head>

  <div class="g-title">Selection Methods</div>
  <div class="wheel-wrap">
    <div class="wheel-svg-wrap">
      <svg id="wheelSvg" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg"></svg>
      <svg id="arrowSvg" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <filter id="redGlow" x="-40%" y="-40%" width="180%" height="180%">
            <feGaussianBlur stdDeviation="4" result="blur"/>
            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>
        <rect x="195" y="-20" width="10" height="22" rx="3" fill="#CC1010" filter="url(#redGlow)"/>
        <polygon points="183,-1 217,-1 200,20" fill="#E03030" filter="url(#redGlow)"/>
        <polygon points="193,-1 200,-1 189,14" fill="rgba(255,160,160,0.35)"/>
      </svg>

    <button id="spinBtn" class="spin-btn" onclick="spin()">SPIN</button>
    <div id="spinCount" class="spin-count">Spin 1 of 8</div>
  </div>

    <div class="slot-label">Selected Delegate</div>
    <div class="slot-window"><div id="slotReel"></div></div>

</div>

<!-- ══════════════ READY OVERLAY ══════════════ -->
<div id="readyOverlay">
  <button id="readyBtn" onclick="handleReady()">&#9654;&nbsp; Tap to Begin</button>
</div>

<script>
const SEGS=[
  {label:'Telescreen',          lines:['Telescreen'],            color:'#F0B420'},
  {label:'Open Days',           lines:['Open','Days'],           color:'#8FA0AA'},
  {label:'Informal Chat',       lines:['Informal','Chat'],       color:'#E87618'},
  {label:'Interview',           lines:['Interview'],             color:'#4272C0'},
  {label:'Assessment Centre',   lines:['Assessment','Centre'],   color:'#50B040'},
  {label:'Presentation',        lines:['Presentation'],          color:'#7AB8D8'},
  {label:'In Tray Exercise',    lines:['In Tray','Exercise'],    color:'#8A5CC2'},
  {label:'Practical Assessment',lines:['Practical','Assessment'],color:'#D84A6A'},
];
const N=SEGS.length, SEG=360/N;
const CX=200,CY=200,R=190;

let delegates=[],spinOrder=[],nameOrder=[];
let spinIdx=0,spinning=false,totalRot=0;
let audioCtx=null;

function ac(){
  if(!audioCtx) audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  return audioCtx;
}

function scheduleTick(ctx,t,vol){
  const sr=ctx.sampleRate;
  const len=Math.ceil(sr*0.018);
  const buf=ctx.createBuffer(1,len,sr);
  const d=buf.getChannelData(0);
  for(let i=0;i<len;i++){
    d[i]=(Math.random()*2-1)*Math.exp(-i/(sr*0.0038));
  }
  const src=ctx.createBufferSource();
  const hpf=ctx.createBiquadFilter();
  hpf.type='highpass';hpf.frequency.value=2200;
  const gain=ctx.createGain();
  src.buffer=buf;
  src.connect(hpf);hpf.connect(gain);gain.connect(ctx.destination);
  gain.gain.setValueAtTime(vol,t);
  src.start(t);
}

function playSpinSound(){
  const ctx=ac(),now=ctx.currentTime;
  let t=0,iv=0.048;
  while(t<3.85){
    const vol=0.5*(1-t/3.85*0.45);
    scheduleTick(ctx,now+t,vol);
    t+=iv;
    iv*=1.052;
  }
}

function playStopSound(){
  const ctx=ac(),now=ctx.currentTime;
  [{f:523,v:.3,d:.9},{f:659,v:.16,d:.6},{f:784,v:.09,d:.4}].forEach(({f,v,d})=>{
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.connect(g);g.connect(ctx.destination);
    o.type='sine';o.frequency.value=f;
    g.gain.setValueAtTime(v,now);
    g.gain.exponentialRampToValueAtTime(0.001,now+d);
    o.start(now);o.stop(now+d);
  });
}

function toRad(deg){return(deg-90)*Math.PI/180}

function segPath(i){
  const a1=toRad(i*SEG),a2=toRad((i+1)*SEG);
  const x1=CX+R*Math.cos(a1),y1=CY+R*Math.sin(a1);
  const x2=CX+R*Math.cos(a2),y2=CY+R*Math.sin(a2);
  return `M${CX},${CY} L${x1.toFixed(2)},${y1.toFixed(2)} A${R},${R},0,0,1,${x2.toFixed(2)},${y2.toFixed(2)} Z`;
}

function drawWheel(){
  const svg=document.getElementById('wheelSvg');
  let h='';
  SEGS.forEach((s,i)=>{
    h+=`<path id="seg${i}" d="${segPath(i)}" fill="${s.color}" stroke="#001020" stroke-width="2.5"/>`;
  });
  for(let i=0;i<N;i++){
    const a=toRad(i*SEG);
    h+=`<line x1="${CX}" y1="${CY}" x2="${(CX+R*Math.cos(a)).toFixed(2)}" y2="${(CY+R*Math.sin(a)).toFixed(2)}" stroke="#001020" stroke-width="2.5"/>`;
  }
  SEGS.forEach((s,i)=>{
    const mid=i*SEG+SEG/2,mRad=toRad(mid),tr=R*0.64;
    const tx=(CX+tr*Math.cos(mRad)).toFixed(2),ty=(CY+tr*Math.sin(mRad)).toFixed(2);
    const fs=s.lines.length>1?12.5:13,lh=15;
    h+=`<g transform="rotate(${mid},${tx},${ty})">`;
    if(s.lines.length===1){
      h+=`<text x="${tx}" y="${ty}" text-anchor="middle" dominant-baseline="middle"
            font-family="Montserrat,sans-serif" font-weight="600" font-size="${fs}"
            stroke="#00000099" stroke-width="4" paint-order="stroke"
            fill="#FFF4B0">${s.lines[0]}</text>`;
    } else {
      s.lines.forEach((ln,li)=>{
        const oy=((li-(s.lines.length-1)/2)*lh).toFixed(2);
        h+=`<text x="${tx}" y="${(parseFloat(ty)+parseFloat(oy)).toFixed(2)}"
              text-anchor="middle" dominant-baseline="middle"
              font-family="Montserrat,sans-serif" font-weight="600" font-size="${fs}"
              stroke="#00000099" stroke-width="4" paint-order="stroke"
              fill="#FFF4B0">${ln}</text>`;
      });
    }
    h+='</g>';
  });
  h+=`<circle cx="${CX}" cy="${CY}" r="${R}" fill="none" stroke="#0061ad" stroke-width="4" opacity=".85"/>`;
  h+=`<circle cx="${CX}" cy="${CY}" r="${R-5}" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>`;
  h+=`<circle cx="${CX}" cy="${CY}" r="26" fill="#001020" stroke="#0061ad" stroke-width="3"/>`;
  h+=`<circle cx="${CX}" cy="${CY}" r="16" fill="#001A30" stroke="rgba(0,97,173,0.45)" stroke-width="1"/>`;
  h+=`<circle cx="${CX}" cy="${CY}" r="5"  fill="#3d9be0"/>`;
  svg.innerHTML=h;
}

function initUpload(){
  const dz=document.getElementById('dropZone');
  const fi=document.getElementById('fileInput');
  dz.addEventListener('dragover',e=>{e.preventDefault();dz.classList.add('over')});
  dz.addEventListener('dragleave',()=>dz.classList.remove('over'));
  dz.addEventListener('drop',e=>{e.preventDefault();dz.classList.remove('over');const f=e.dataTransfer.files[0];if(f)readFile(f)});
  dz.addEventListener('click',e=>{if(e.target.tagName!=='BUTTON')fi.click()});
  document.getElementById('browseBtn').addEventListener('click',e=>{e.stopPropagation();fi.click()});
  fi.addEventListener('change',()=>{if(fi.files[0])readFile(fi.files[0]);fi.value=''});
  document.getElementById('skipLink').addEventListener('click',e=>{e.preventDefault();delegates=[];startGame()});
}

function readFile(f){
  const r=new FileReader();
  if(f.name.toLowerCase().endsWith('.csv')){r.onload=e=>loadCSV(e.target.result);r.readAsText(f);}
  else{r.onload=e=>loadXLSX(e.target.result);r.readAsArrayBuffer(f);}
}

function loadCSV(txt){
  const rows=txt.trim().split(/\r?\n/).map(r=>r.split(',').map(c=>c.trim().replace(/^"|"$/g,'')));
  const start=/first|name/i.test(rows[0]?.[0]||'')?1:0;
  delegates=rows.slice(start).filter(r=>r[0]&&r[0].trim()).map(r=>(r[0]+' '+(r[1]||'')).trim());
  showDelegates();
}

function loadXLSX(buf){
  try{
    const wb=XLSX.read(buf,{type:'array'});
    const data=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1});
    const start=/first|name/i.test(String(data[0]?.[0]||''))?1:0;
    delegates=data.slice(start).filter(r=>r[0]).map(r=>(r[0]+' '+(r[1]||'')).trim());
    showDelegates();
  }catch(e){alert('Could not read that file. Please try a CSV or .xlsx file.')}
}

function showDelegates(){
  if(!delegates.length)return;
  document.getElementById('delegateCount').textContent=`${delegates.length} Delegate${delegates.length>1?'s':''} Loaded`;
  document.getElementById('delegateNames').innerHTML=delegates.map(d=>`<div class="d-item">&#8226; ${d}</div>`).join('');
  document.getElementById('delegatePreview').classList.remove('hidden');
  document.getElementById('launchBtn').classList.remove('hidden');
}

function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}

function buildNameOrder(dels,n){
  if(!dels.length)return[];
  if(dels.length>=n)return shuffle(dels).slice(0,n);
  const base=shuffle([...dels]);
  const fill=[];
  while(base.length+fill.length<n)fill.push(dels[Math.floor(Math.random()*dels.length)]);
  return shuffle([...base,...fill]);
}

function startGame(){
  spinOrder=shuffle([...Array(N).keys()]);
  nameOrder=buildNameOrder(delegates,N);
  spinIdx=0;totalRot=0;spinning=false;
  const svg=document.getElementById('wheelSvg');
  svg.style.transition='none';svg.style.transform='rotate(0deg)';
  for(let i=0;i<N;i++){const el=document.getElementById('seg'+i);if(el){el.style.transition='';el.style.filter='';}}
  document.getElementById('spinBtn').disabled=false;
  document.getElementById('slotWrap').classList.add('hidden');
  document.getElementById('resetBtn').classList.add('hidden');
  updateCounter();
  document.getElementById('setupScreen').classList.remove('active');
  document.getElementById('gameScreen').classList.add('active');
  document.getElementById('readyOverlay').classList.add('show');
}

function resetGame(){startGame()}

function goSetup(){
  spinning=false;
  document.getElementById('readyOverlay').classList.remove('show');
  document.getElementById('gameScreen').classList.remove('active');
  document.getElementById('setupScreen').classList.add('active');
}

function handleReady(){
  const ctx=ac();
  ctx.resume().then(()=>{
    const sr=ctx.sampleRate, now=ctx.currentTime;
    const len=Math.ceil(sr*0.018);
    const buf=ctx.createBuffer(1,len,sr);
    const d=buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.exp(-i/(sr*0.003));
    const src=ctx.createBufferSource();
    const bpf=ctx.createBiquadFilter(); bpf.type='bandpass'; bpf.frequency.value=4800; bpf.Q.value=1.0;
    const g=ctx.createGain(); g.gain.setValueAtTime(0.45,now);
    src.buffer=buf; src.connect(bpf); bpf.connect(g); g.connect(ctx.destination);
    src.start(now);
  });
  const btn=document.getElementById('readyBtn');
  btn.style.animation='none';
  btn.style.transition='transform .12s ease-out, opacity .45s ease .1s, background .15s ease';
  btn.style.background='linear-gradient(135deg,#ffffff,#c8e4f8)';
  btn.style.transform='scale(1.14)';
  setTimeout(()=>{btn.style.opacity='0';btn.style.transform='scale(1)'},80);
  setTimeout(()=>{
    document.getElementById('readyOverlay').classList.remove('show');
    btn.style.opacity=''; btn.style.transform=''; btn.style.background='';
    btn.style.transition=''; btn.style.animation='';
  },550);
}

function spin(){
  if(spinning||spinIdx>=N)return;
  spinning=true;
  const ctx=ac(); if(ctx.state==='suspended') ctx.resume();
  const btn=document.getElementById('spinBtn');
  btn.disabled=true;
  document.getElementById('slotWrap').classList.add('hidden');

  const target=spinOrder[spinIdx];
  const segAngle=target*SEG+SEG/2;
  const goal=(360-segAngle)%360;
  const norm=((totalRot%360)+360)%360;
  let extra=(goal-norm+360)%360;
  if(extra<SEG/2)extra+=360;
  const newRot=totalRot+1440+extra;

  playSpinSound();

  const svg=document.getElementById('wheelSvg');
  svg.style.transition='none';
  void svg.offsetWidth;
  svg.style.transition='transform 4s cubic-bezier(0.17,0.67,0.12,1.0)';
  svg.style.transform=`rotate(${newRot}deg)`;

  setTimeout(()=>{svg.style.transition='transform 0.14s ease-in';svg.style.transform=`rotate(${newRot+7}deg)`},4000);
  setTimeout(()=>{svg.style.transition='transform 0.3s cubic-bezier(0.34,1.56,0.64,1)';svg.style.transform=`rotate(${newRot}deg)`},4140);

  setTimeout(()=>{
    totalRot=newRot;
    playStopSound();
    flashSegment(target);
    if(delegates.length>0){runSlot(nameOrder[spinIdx],advance);}else{advance();}
  },4500);

  function advance(){
    spinIdx++;updateCounter();spinning=false;
    if(spinIdx<N){btn.disabled=false;}
    else{
      const rb=document.getElementById('resetBtn');
      rb.classList.remove('hidden');rb.classList.add('pop-in');
      setTimeout(()=>rb.classList.remove('pop-in'),400);
    }
  }
}

function flashSegment(i){
  const el=document.getElementById('seg'+i);if(!el)return;
  el.style.transition='filter 0.2s';el.style.filter='brightness(1.7) saturate(1.5)';
  setTimeout(()=>{el.style.transition='filter 1.4s ease';el.style.filter=''},220);
}

function updateCounter(){
  document.getElementById('spinCount').textContent=spinIdx>=N?`All ${N} Spins Complete!`:`Spin ${spinIdx+1} of ${N}`;
}

function playSlotTicks(){
  const ctx=ac(), now=ctx.currentTime;
  const sr=ctx.sampleRate;
  let t=0, iv=0.035;
  for(let i=0;i<31;i++){
    const len=Math.ceil(sr*0.012);
    const buf=ctx.createBuffer(1,len,sr);
    const d=buf.getChannelData(0);
    for(let j=0;j<len;j++){
      d[j]=(Math.random()*2-1)*Math.exp(-j/(sr*0.0022));
    }
    const src=ctx.createBufferSource();
    const bpf=ctx.createBiquadFilter();
    bpf.type='bandpass';bpf.frequency.value=5500+Math.random()*800;bpf.Q.value=1.2;
    const gain=ctx.createGain();
    const vol=0.55*(1-i/31*0.35);
    src.buffer=buf;
    src.connect(bpf);bpf.connect(gain);gain.connect(ctx.destination);
    gain.gain.setValueAtTime(vol, now+t);
    src.start(now+t);
    t+=iv;
    iv*=1.072;
  }
}

function playSlotStopSound(){
  const ctx=ac(), now=ctx.currentTime;
  [{f:2800,v:.28,d:.18},{f:3600,v:.16,d:.12},{f:5200,v:.09,d:.08}].forEach(({f,v,d})=>{
    const o=ctx.createOscillator(), g=ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.type='sine'; o.frequency.value=f;
    g.gain.setValueAtTime(v, now);
    g.gain.exponentialRampToValueAtTime(0.001, now+d);
    o.start(now); o.stop(now+d);
  });
}

function runSlot(name,onDone){
  const wrap=document.getElementById('slotWrap');
  const reel=document.getElementById('slotReel');
  const IH=56,PRE=30;
  const items=[];
  for(let i=0;i<PRE;i++)items.push(delegates[Math.floor(Math.random()*delegates.length)]);
  items.push(name);
  reel.innerHTML=items.map(n=>`<div class="reel-item">${n}</div>`).join('');
  wrap.classList.remove('hidden');wrap.classList.add('pop-in');
  setTimeout(()=>wrap.classList.remove('pop-in'),350);
  reel.style.transition='none';reel.style.transform='translateY(0)';void reel.offsetWidth;
  const scroll=PRE*IH;
  setTimeout(()=>{
    reel.style.transition='transform 2.7s cubic-bezier(0.05,0.82,0.28,1)';
    reel.style.transform=`translateY(-${scroll}px)`;
    playSlotTicks();
  },60);
  setTimeout(()=>{
    reel.style.transition='transform 0.11s ease-in';reel.style.transform=`translateY(-${scroll-10}px)`;
    setTimeout(()=>{
      reel.style.transition='transform 0.24s cubic-bezier(0.34,1.56,0.64,1)';
      reel.style.transform=`translateY(-${scroll}px)`;
      playSlotStopSound();
    },110);
  },2760);
  setTimeout(onDone,3500);
}

drawWheel();
initUpload();
</script>
